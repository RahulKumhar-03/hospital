<div style="padding: 5px 20px;">
    <div>
        <button mat-fab extended (click)="openNurseDialog()">
          <mat-icon>add</mat-icon>
          Add Nurse
        </button>
    </div>
    <div class="card-container">
        @for(nurse of nurses; track nurse.name) {
            <mat-card class="example-card" appearance="outlined">
                <mat-card-header>
                    <mat-card-title>{{nurse.name}}</mat-card-title>
                </mat-card-header>
                <mat-card-content>
                    <p>{{nurse.position}}</p>
                    @if(nurse.registered){
                        <p>Registered</p>
                    }
                </mat-card-content>
                <mat-card-actions>
                    <button mat-button (click)="openNurseDialog(nurse)">Edit</button>
                    <button mat-button (click)="deleteNurseRecord(nurse)">Delete</button>
                </mat-card-actions>
            </mat-card>
        }
    </div>
</div>

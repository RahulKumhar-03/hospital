
<div style="justify-items: center;">
    <h2 style="padding-top: 5px;">{{isEditMode ? 'Update Nurse Details' : 'Add New Nurse'}}</h2>
  <form [formGroup]="nurseForm" (submit)="submitForm()" style="display: flex; flex-direction: column; margin: auto; width: 80%; padding: 30px 0;">
    <mat-form-field>
      <input matInput placeholder="Nurse Name" formControlName="name" />
    </mat-form-field>
    <mat-form-field>
      <input matInput placeholder="Eg.Cardiology Nurse" formControlName="position"/>
    </mat-form-field>
    <div>
        <button mat-button [disabled]="nurseForm.invalid" type="submit">
            Submit
        </button>
        <button mat-button (click)="onClose()">
            Cancel
        </button>
    </div>
  </form>
</div>

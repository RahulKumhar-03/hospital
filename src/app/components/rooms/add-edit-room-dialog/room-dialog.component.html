<div style="justify-items: center;">
    <h2 style="padding-top: 5px;">{{isEditMode ? 'Update Room Details' : 'Add Room'}}</h2>
  <form [formGroup]="roomForm" (submit)="submitForm()" style="display: flex; flex-direction: column; margin: auto; width: 80%; padding: 30px 0;">
    <mat-form-field>
      <mat-label>Room Number</mat-label>
      <input matInput type="number" placeholder="Room Number" formControlName="roomNumber" />
    </mat-form-field>

    <mat-form-field>
      <mat-select formControlName="blockId" placeholder="Select Block Id">
        @for(block of blockData; track block.blockCode){
          <mat-option [value]="block.blockId">{{block.blockId}}</mat-option>
        }
      </mat-select>
    </mat-form-field>

    <mat-form-field>
      <input matInput placeholder="Eg.Maternity Care Patient Room" formControlName="roomType"/>
    </mat-form-field>

    <div>
      <mat-label style="margin-right: 20px;">Room Availability:</mat-label>
      <mat-slide-toggle formControlName="availability"></mat-slide-toggle>
    </div>

    <div>
        <button mat-button [disabled]="roomForm.invalid" type="submit">
            Submit
        </button>
        <button mat-button (click)="onClose()">
            Cancel
        </button>
    </div>
  </form>
</div>

<div style="padding: 10px 20px">

    <div>
        <button mat-button extended (click)="openRoomDialog()">
          <mat-icon>add</mat-icon>
          Add New Room
        </button>
    </div>

    <div style="padding: 15px 40px">
    <table mat-table [dataSource]="dataSource" class="mat-elevation-z8">

        <ng-container matColumnDef="roomNo.">
        <th mat-header-cell *matHeaderCellDef>Room No.</th>
        <td mat-cell *matCellDef="let element">{{ element.roomNumber }}</td>
        </ng-container>

        <ng-container matColumnDef="roomType">
        <th mat-header-cell *matHeaderCellDef>Room Type</th>
        <td mat-cell *matCellDef="let element">{{ element.roomType }}</td>
        </ng-container>

        <ng-container matColumnDef="availability">
        <th mat-header-cell *matHeaderCellDef>Room Availability</th>
        <td mat-cell *matCellDef="let element">{{ element.availability }}</td>
        </ng-container>

        <ng-container matColumnDef="blockCode">
        <th mat-header-cell *matHeaderCellDef>Block Code</th>
        <td mat-cell *matCellDef="let element">{{ element.block.blockCode }}</td>
        </ng-container>

        <ng-container matColumnDef="blockFloor">
        <th mat-header-cell *matHeaderCellDef>Block Floor No.</th>
        <td mat-cell *matCellDef="let element">{{ element.block.blockFloor }}</td>
        </ng-container>

        <ng-container matColumnDef="action">
        <th mat-header-cell *matHeaderCellDef>Action</th>
        <td mat-cell *matCellDef="let element">
            <div>
                <button mat-button (click)="openRoomDialog(element)">Edit</button>
                <button mat-button (click)="deleteRoom(element)">Delete</button>
            </div>
        </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>
    </div>

</div>

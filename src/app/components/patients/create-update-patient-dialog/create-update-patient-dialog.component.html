<div style="justify-items: center;">
    <h2 style="padding-top: 5px;">{{isEditMode ? 'Update Physician Details' : 'Add New Physician'}}</h2>
  <form [formGroup]="patientForm" (submit)="submitForm()" style="display: flex; flex-direction: column; margin: auto; width: 80%; padding: 30px 0;">
    <mat-form-field>
      <input matInput placeholder="Eg.Michael Ross" formControlName="name" />
    </mat-form-field>

    <mat-form-field>
      <input matInput placeholder="Eg. Mumbai,Maharashtra" formControlName="address"/>
    </mat-form-field>

    <mat-form-field>
      <input matInput placeholder="Eg. +91 1234 56 7890" formControlName="phone"/>
    </mat-form-field>
    <div>
        <button mat-button [disabled]="patientForm.invalid" type="submit">
            Submit
        </button>
        <button mat-button (click)="onClose()">
            Cancel
        </button>
    </div>
  </form>
</div>

<div style="padding: 10px 20px">

    <div>
        <button mat-button extended (click)="openOnCallDialog()">
          <mat-icon>add</mat-icon>
          Add New Room
        </button>
    </div>

    <div style="padding: 15px 40px">
    <table mat-table [dataSource]="dataSource" class="mat-elevation-z8">

        <ng-container matColumnDef="nurseId">
        <th mat-header-cell *matHeaderCellDef>Nurse ID</th>
        <td mat-cell *matCellDef="let element">{{ element.nurse.nurseId }}</td>
        </ng-container>

        <ng-container matColumnDef="nurseName">
        <th mat-header-cell *matHeaderCellDef>Nurse Name</th>
        <td mat-cell *matCellDef="let element">{{ element.nurse.name }}</td>
        </ng-container>

        <ng-container matColumnDef="blockId">
        <th mat-header-cell *matHeaderCellDef>Block ID</th>
        <td mat-cell *matCellDef="let element">{{ element.block.blockId }}</td>
        </ng-container>

        <ng-container matColumnDef="blockFloor">
        <th mat-header-cell *matHeaderCellDef>Block Floor No.</th>
        <td mat-cell *matCellDef="let element">{{ element.block.blockFloor }}</td>
        </ng-container>

        <ng-container matColumnDef="blockCode">
        <th mat-header-cell *matHeaderCellDef>Block Code</th>
        <td mat-cell *matCellDef="let element">{{ element.block.blockCode }}</td>
        </ng-container>

        <ng-container matColumnDef="onCallStart">
        <th mat-header-cell *matHeaderCellDef>Call Start</th>
        <td mat-cell *matCellDef="let element">{{ element.onCallStart }}</td>
        </ng-container>

        <ng-container matColumnDef="onCallEnd">
        <th mat-header-cell *matHeaderCellDef>Call End</th>
        <td mat-cell *matCellDef="let element">{{ element.onCallEnd }}</td>
        </ng-container>

        <ng-container matColumnDef="action">
        <th mat-header-cell *matHeaderCellDef>Action</th>
        <td mat-cell *matCellDef="let element">
            <div>
                <button mat-button (click)="openOnCallDialog(element)">Edit</button>
                <button mat-button (click)="deleteOnCallRecord(element)">Delete</button>
            </div>
        </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>
    </div>

</div>

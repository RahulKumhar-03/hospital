<div style="padding: 5px 20px;">
    <div>
        <button mat-fab extended (click)="openPhysicianDialog()">
          <mat-icon>add</mat-icon>
          Add Physician
        </button>
    </div>
    <div class="card-container">
        @for(physician of physicians; track physician.name) {
            <mat-card class="example-card" appearance="outlined">
                <mat-card-header>
                    <mat-card-title>{{physician.name}}</mat-card-title>
                </mat-card-header>
                <mat-card-content>
                    <p>{{physician.position}}</p>
                    @if(physician.appointments.length > 0){
                        <p>No. of Patient Treated {{physician.appointments.length}}</p>
                    }
                </mat-card-content>
                <mat-card-actions>
                    <button mat-button (click)="openPhysicianDialog(physician)">Edit</button>
                    <button mat-button (click)="deletePhysician(physician)">Delete</button>
                </mat-card-actions>
            </mat-card>
        }
    </div>
</div>

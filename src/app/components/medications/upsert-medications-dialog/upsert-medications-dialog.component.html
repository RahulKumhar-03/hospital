<div style="justify-items: center;">
    <h2 style="padding-top: 5px;">{{isEditting ? 'Update Medication Details' : 'Add New Medication'}}</h2>
  <form [formGroup]="medicationForm" (submit)="submitForm()" style="display: flex; flex-direction: column; margin: auto; width: 80%; padding: 30px 0;">
    
    <mat-form-field>
      <mat-label>Medication Name</mat-label>
      <input matInput placeholder="Eg. Acyclovir" formControlName="medicationName" />
    </mat-form-field>

    <mat-form-field>
      <mat-label>Medication Brand</mat-label>
      <input matInput placeholder="Eg. ZOVIRAX" formControlName="medicationBrand"/>
    </mat-form-field>

    <mat-form-field>
      <mat-label>Medication Description</mat-label>
      <input matInput placeholder="Eg. Acyclovir is used to treat infections caused by certain types of viruses." formControlName="medicationDescription"/>
    </mat-form-field>

    <div>
        <button mat-button [disabled]="medicationForm.invalid" type="submit">
            Submit
        </button>
        <button mat-button (click)="onClose()">
            Cancel
        </button>
    </div>
  </form>
</div>

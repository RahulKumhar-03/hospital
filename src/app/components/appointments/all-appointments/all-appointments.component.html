<div style="padding: 10px 20px">

    <div>
        <button mat-button extended (click)="openAppointmentDialog()">
          <mat-icon>add</mat-icon>
          New Appointment 
        </button>
    </div>

    <div style="padding: 15px 40px">
    <table mat-table [dataSource]="dataSource" class="mat-elevation-z8">

        <ng-container matColumnDef="appointmentId">
            <th mat-header-cell *matHeaderCellDef>Appointment ID</th>
            <td mat-cell *matCellDef="let element">{{ element.appointmentId }}</td>
        </ng-container>

        <ng-container matColumnDef="patientName">
            <th mat-header-cell *matHeaderCellDef>Patient Name</th>
            <td mat-cell *matCellDef="let element">{{ element.patient.name }}</td>
        </ng-container>

        <ng-container matColumnDef="physicianName">
            <th mat-header-cell *matHeaderCellDef>Physician Name</th>
            <td mat-cell *matCellDef="let element">{{ element.physician.name }}</td>
        </ng-container>
        
        <ng-container matColumnDef="onCallNurseName">
            <th mat-header-cell *matHeaderCellDef>Prep Nurse</th>
            <td mat-cell *matCellDef="let element">{{ element.prepNurse.nurse.name }}</td>
        </ng-container>

        <ng-container matColumnDef="startDate">
            <th mat-header-cell *matHeaderCellDef>Start Date</th>
            <td mat-cell *matCellDef="let element">{{ element.starDateTime }}</td>
        </ng-container>

        <ng-container matColumnDef="endDate">
            <th mat-header-cell *matHeaderCellDef>End Date</th>
            <td mat-cell *matCellDef="let element">{{ element.endDateTime }}</td>
        </ng-container>

        <ng-container matColumnDef="action">
            <th mat-header-cell *matHeaderCellDef>Action</th>
            <td mat-cell *matCellDef="let element">
                <div>
                    <button mat-button (click)="openAppointmentDialog(element)">Edit</button>
                    <button mat-button (click)="deleteAppointmentRecord(element)">Delete</button>
                </div>
            </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>
    </div>

</div>

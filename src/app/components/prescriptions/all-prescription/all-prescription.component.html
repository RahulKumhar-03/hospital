<div style="padding: 10px 20px">

    <div>
        <button mat-button extended (click)="openPrescriptionDialog()">
          <mat-icon>add</mat-icon>
          Add Prescription
        </button>
    </div>

    <div style="padding: 15px 40px">
    <table mat-table [dataSource]="dataSource" class="mat-elevation-z8">

        <ng-container matColumnDef="prescribedId">
        <th mat-header-cell *matHeaderCellDef>ID</th>
        <td mat-cell *matCellDef="let element">{{ element.prescribedId }}</td>
        </ng-container>

        <ng-container matColumnDef="patientName">
        <th mat-header-cell *matHeaderCellDef>Patient Name</th>
        <td mat-cell *matCellDef="let element">{{ element.patientName }}</td>
        </ng-container>

        <ng-container matColumnDef="patientPhone">
        <th mat-header-cell *matHeaderCellDef>Patient Phone</th>
        <td mat-cell *matCellDef="let element">{{ element.phone }}</td>
        </ng-container>

        <ng-container matColumnDef="appointmentDate">
        <th mat-header-cell *matHeaderCellDef>Appointment Date</th>
        <td mat-cell *matCellDef="let element">{{ element.appointmentDate }}</td>
        </ng-container>

        <ng-container matColumnDef="medicationName">
        <th mat-header-cell *matHeaderCellDef>Medication Prescribed</th>
        <td mat-cell *matCellDef="let element">{{ element.medication.name }}</td>
        </ng-container>

        <ng-container matColumnDef="physicianName">
        <th mat-header-cell *matHeaderCellDef>Physician Name</th>
        <td mat-cell *matCellDef="let element">{{ element.physician.name }}</td>
        </ng-container>

        <ng-container matColumnDef="action">
        <th mat-header-cell *matHeaderCellDef>Action</th>
        <td mat-cell *matCellDef="let element">
            <div>
                <button mat-button (click)="openPrescriptionDialog(element)">Edit</button>
                <button mat-button (click)="deletePrescription(element)">Delete</button>
            </div>
        </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>
    </div>

</div>
